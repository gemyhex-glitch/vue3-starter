<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter Dashboard</title>
    <style>
      :root {
        --initial-loader-primary: #2563eb;
        --initial-loader-base: #030712;
      }

      body {
        margin: 0;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }

      .initial-loader__stage {
        position: relative;
        display: grid;
        width: 6rem;
        height: 6rem;
        place-items: center;
        perspective: 760px;
        transform-style: preserve-3d;
      }

      .initial-loader__stage::before {
        position: absolute;
        width: 7.75rem;
        height: 7.75rem;
        border-radius: 999px;
        background:
          radial-gradient(circle, rgb(37 99 235 / 0.28) 0%, rgb(37 99 235 / 0.12) 38%, transparent 70%);
        content: '';
        opacity: 0;
        transform: scale(0.7);
        animation: initial-loader-halo 1.45s 1.05s ease-out both;
      }

      .initial-loader__stage::after {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        .initial-loader__stage::after {
          display: none;
        }
      }

      .initial-loader__shadow {
        position: absolute;
        bottom: -0.72rem;
        width: 4.35rem;
        height: 0.85rem;
        border-radius: 999px;
        background: rgb(15 23 42 / 0.34);
        filter: blur(8px);
        animation: initial-loader-shadow 1.15s cubic-bezier(0.16, 0.9, 0.22, 1) both;
      }

      .initial-loader__logo-wrap {
        position: relative;
        z-index: 1;
        width: 4.25rem;
        height: 4.25rem;
        transform-origin: center bottom;
        transform-style: preserve-3d;
        will-change: transform;
        animation: initial-loader-jump-spin 1.15s cubic-bezier(0.16, 0.9, 0.22, 1) both;
      }

      .initial-loader__logo-svg {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .initial-loader__logo-base {
        color: var(--initial-loader-base);
        fill: currentColor;
        filter: drop-shadow(0 0.9rem 1.2rem rgb(15 23 42 / 0.22));
      }

      .initial-loader__logo-fill {
        color: var(--initial-loader-primary);
        fill: currentColor;
        filter: drop-shadow(0 0 0.65rem rgb(37 99 235 / 0.45));
      }

      .initial-loader__logo-fill-shell {
        clip-path: inset(100% 0 0 0);
        will-change: clip-path;
        animation: initial-loader-fill-up 1.45s 1.15s cubic-bezier(0.2, 0.9, 0.24, 1) both;
      }

      .initial-loader__sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes initial-loader-jump-spin {
        0% {
          transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) scale(1);
        }

        18% {
          transform: translate3d(0, -0.75rem, 2.25rem) rotateX(4deg) rotateY(92deg) scale(1.02);
        }

        52% {
          transform: translate3d(0, -2.25rem, 3.5rem) rotateX(8deg) rotateY(245deg) scale(1.055);
        }

        74% {
          transform: translate3d(0, -0.45rem, 1rem) rotateX(2deg) rotateY(342deg) scale(1.015);
        }

        82% {
          transform: translate3d(0, 0.16rem, 0) rotateX(0deg) rotateY(360deg) scale(1.1, 0.88);
        }

        91% {
          transform: translate3d(0, -0.14rem, 0.35rem) rotateX(0deg) rotateY(360deg) scale(0.98, 1.04);
        }

        100% {
          transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(360deg) scale(1);
        }
      }

      @keyframes initial-loader-shadow {
        0% {
          opacity: 0.22;
          transform: scaleX(0.96);
        }

        52% {
          opacity: 0.07;
          transform: scaleX(0.34);
        }

        82% {
          opacity: 0.42;
          transform: scaleX(1.28);
        }

        91% {
          opacity: 0.2;
          transform: scaleX(0.82);
        }

        100% {
          opacity: 0.24;
          transform: scaleX(1);
        }
      }

      @keyframes initial-loader-halo {
        0% {
          opacity: 0;
          transform: scale(0.68);
        }

        32% {
          opacity: 1;
          transform: scale(1);
        }

        100% {
          opacity: 0.48;
          transform: scale(1.06);
        }
      }

      @keyframes initial-loader-fill-up {
        to {
          clip-path: inset(0 0 0 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-loader__stage::before,
        .initial-loader__shadow,
        .initial-loader__logo-wrap,
        .initial-loader__logo-base,
        .initial-loader__logo-fill-shell {
          animation: none;
        }

        .initial-loader__logo-fill-shell {
          clip-path: inset(0 0 0 0);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="initial-loader" role="status" aria-live="polite" aria-label="Loading application">
        <div class="initial-loader__stage">
          <span class="initial-loader__shadow" aria-hidden="true"></span>
          <div class="initial-loader__logo-wrap" aria-hidden="true">
            <svg class="initial-loader__logo-svg initial-loader__logo-base" viewBox="0 0 48 46" aria-hidden="true">
              <path d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
              <path d="M10.931 2.6 3.072 13.605h12.071c3.958 0 6.257 4.47 3.956 7.692l-5.542 7.758h8.106a4.883 4.883 0 0 1 4.881 4.881v4.06l17.23-19.539h-8.666c-3.958 0-6.257-4.47-3.956-7.692L36.983 2.6z" />
            </svg>
            <svg class="initial-loader__logo-svg initial-loader__logo-fill initial-loader__logo-fill-shell" viewBox="0 0 48 46" aria-hidden="true">
              <path d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
              <path d="M10.931 2.6 3.072 13.605h12.071c3.958 0 6.257 4.47 3.956 7.692l-5.542 7.758h8.106a4.883 4.883 0 0 1 4.881 4.881v4.06l17.23-19.539h-8.666c-3.958 0-6.257-4.47-3.956-7.692L36.983 2.6z" />
            </svg>
          </div>
          <span class="initial-loader__sr-only">Loading application</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
